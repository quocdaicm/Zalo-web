name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén
        run: unzip -q ZaloWebSwitcher.zip -d app

      - name: Cài XcodeGen và tạo dự án
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (không ký)
        working-directory: app
        run: |
          xcodebuild \
            -project ZaloWebSwitcher.xcodeproj \
            -scheme ZaloWebSwitcher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        working-directory: app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ZaloWebSwitcher.app Payload/
          zip -qry ZaloWebSwitcher.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ZaloWebSwitcher-ipa
          path: app/ZaloWebSwitcher.ipa
